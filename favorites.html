<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title data-i18n="favoritesPage.title">Избранное — 5K</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;700;800;900&family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="section-paper font-body text-ink-900">
<a href="#main" class="skip-link">Skip to content</a>
<div id="app-header"></div>

<main id="main">
  <div class="container-5k pt-10 pb-20">
    <div class="mb-10 reveal">
      <h1 class="font-display font-bold text-3xl md:text-4xl mb-2" data-i18n="favoritesPage.title"></h1>
      <p class="text-ink-600" data-i18n="favoritesPage.subtitle"></p>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6" id="fav-grid"></div>
  </div>
</main>

<div id="app-footer"></div>
<div id="app-whatsapp"></div>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/products.js"></script>
<script>
  FIVEK.mountLayout("favorites");
  function renderFav(lang) {
    var list = FIVEK_PRODUCTS.slice(0, 4);
    document.getElementById("fav-grid").innerHTML = list.map(function (p) { return productCardHTML(p, lang); }).join("");
    FIVEK.refreshReveal();
  }
  renderFav(FIVEK.getLang());
  document.addEventListener("5k:lang-changed", function (e) { renderFav(e.detail.lang); });
</script>
</body>
</html>
