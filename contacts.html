<body class="section-paper font-body text-ink-900">

      <a href="https://wa.me/77770464141" target="_blank" rel="noopener" class="surface-card p-5 reveal" style="transition-delay:.05s">
        <span class="w-10 h-10 rounded-xl bg-leaf-500/15 text-leaf-600 flex items-center justify-center mb-3">🟢</span>

      <a href="mailto:info@5k.kz" class="surface-card p-5 reveal" style="transition-delay:.1s">

      </a>
      <div class="surface-card p-5 reveal" style="transition-delay:.15s">
        <span class="w-10 h-10 rounded-xl bg-paper-100 flex items-center justify-center mb-3">📍</span>
        <div class="text-ink-500 text-xs mb-1" data-i18n="contactsPage.address"></div>
        <div class="font-bold text-sm" data-i18n="contactsPage.addressValue"></div>
      </div>
    </div>

    <div class="grid lg:grid-cols-2 gap-10">
      <div class="reveal">
        <h2 class="font-display font-bold text-2xl mb-6" data-i18n="contactsPage.formTitle"></h2>
        <form class="surface-card p-6 space-y-4" onsubmit="return false">
          <div><label class="text-xs font-semibold text-ink-500 mb-1.5 block" data-i18n="contactsPage.formName"></label><input type="text" class="w-full border border-line rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-gold-400" /></div>

          <div><label class="text-xs font-semibold text-ink-500 mb-1.5 block" data-i18n="contactsPage.formEmail"></label><input type="email" class="w-full border border-line rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-gold-400" /></div>
          <div><label class="text-xs font-semibold text-ink-500 mb-1.5 block" data-i18n="contactsPage.formMessage"></label><textarea rows="4" class="w-full border border-line rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-gold-400"></textarea></div>
          <label class="flex items-start gap-2 text-xs text-ink-500"><input type="checkbox" class="mt-0.5 accent-gold-400" /><span data-i18n="contactsPage.formConsent"></span></label>

          <img src="https://placehold.co/700x500/EEF0F3/5B6472?text=2GIS+Map" alt="2GIS карта" class="w-full h-full object-cover" loading="lazy" />

          <span data-i18n="home.reviews.gis.cta"></span>
