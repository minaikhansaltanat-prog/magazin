<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title data-i18n="helpPage.title">Помощь — 5K</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;700;800;900&family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="section-paper font-body text-ink-900">
<a href="#main" class="skip-link">Skip to content</a>
<div id="app-header"></div>

<main id="main">
  <div class="container-5k pt-10 pb-20">
    <div class="mb-12 reveal">
      <h1 class="font-display font-bold text-3xl md:text-4xl mb-2" data-i18n="helpPage.title"></h1>
      <p class="text-ink-600" data-i18n="helpPage.subtitle"></p>
    </div>

    <div class="grid md:grid-cols-2 gap-6">
      <div id="delivery" class="surface-card p-7 reveal">
        <span class="w-11 h-11 rounded-xl bg-paper-100 flex items-center justify-center mb-4"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="7" width="15" height="10" rx="2"/><path d="M16 10h3.5L22 13.5V17h-6"/><circle cx="6" cy="19.5" r="1.7"/><circle cx="18" cy="19.5" r="1.7"/></svg></span>
        <h2 class="font-display font-bold text-lg mb-2" data-i18n="helpPage.delivery.title"></h2>
        <p class="text-ink-600 text-sm leading-relaxed" data-i18n="helpPage.delivery.desc"></p>
      </div>
      <div id="payment" class="surface-card p-7 reveal" style="transition-delay:.05s">
        <span class="w-11 h-11 rounded-xl bg-paper-100 flex items-center justify-center mb-4"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><line x1="2" y1="10" x2="22" y2="10"/></svg></span>
        <h2 class="font-display font-bold text-lg mb-2" data-i18n="helpPage.payment.title"></h2>
        <p class="text-ink-600 text-sm leading-relaxed" data-i18n="helpPage.payment.desc"></p>
      </div>
      <div id="returns" class="surface-card p-7 reveal" style="transition-delay:.1s">
        <span class="w-11 h-11 rounded-xl bg-paper-100 flex items-center justify-center mb-4"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></span>
        <h2 class="font-display font-bold text-lg mb-2" data-i18n="helpPage.returns.title"></h2>
        <p class="text-ink-600 text-sm leading-relaxed" data-i18n="helpPage.returns.desc"></p>
      </div>
      <div class="surface-card p-7 reveal" style="transition-delay:.15s">
        <span class="w-11 h-11 rounded-xl bg-paper-100 flex items-center justify-center mb-4"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a2 2 0 0 0-2-2 2 2 0 0 0-2 2v4H4l1 11h14l1-11h-6Z"/></svg></span>
        <h2 class="font-display font-bold text-lg mb-2" data-i18n="helpPage.support.title"></h2>
        <p class="text-ink-600 text-sm leading-relaxed" data-i18n="helpPage.support.desc"></p>
      </div>
    </div>

    <div class="text-center mt-14 reveal">
      <a href="faq.html" class="btn btn-ghost-light" data-i18n="home.faq.cta"></a>
    </div>
  </div>
</main>

<div id="app-footer"></div>
<div id="app-whatsapp"></div>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>FIVEK.mountLayout("help");</script>
</body>
</html>
