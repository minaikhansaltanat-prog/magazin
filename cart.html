<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title data-i18n="cart.title">Корзина — 5K</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;700;800;900&family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="section-paper font-body text-ink-900">
<a href="#main" class="skip-link">Skip to content</a>
<div id="app-header"></div>

<main id="main">
  <div class="container-5k pt-8 pb-20">
    <h1 class="font-display font-bold text-3xl md:text-4xl mb-8" data-i18n="cart.title"></h1>

    <div id="cart-content" class="grid lg:grid-cols-[1fr_360px] gap-10 items-start">
      <div class="space-y-4" id="cart-items"></div>

      <div class="surface-card p-6 lg:sticky" style="top: calc(var(--header-h) + 16px)">
        <h2 class="font-display font-bold text-lg mb-5" data-i18n="cart.summary.title"></h2>
        <div class="flex gap-2 mb-5">
          <input type="text" data-i18n-placeholder="cart.promoPlaceholder" class="flex-1 border border-line rounded-full px-4 py-2.5 text-sm focus:outline-none focus:border-gold-400" />
          <button type="button" class="btn btn-ghost-light !px-4 !py-2.5 text-sm" data-i18n="cart.promoApply"></button>
        </div>
        <div class="space-y-3 text-sm mb-5">
          <div class="flex justify-between"><span class="text-ink-500" data-i18n="cart.summary.subtotal"></span><span class="font-semibold" id="cart-subtotal">15 000 ₸</span></div>
          <div class="flex justify-between"><span class="text-ink-500" data-i18n="cart.summary.delivery"></span><span class="font-semibold text-leaf-600" data-i18n="cart.summary.deliveryFree"></span></div>
          <div class="flex justify-between"><span class="text-ink-500" data-i18n="cart.summary.pointsEarn"></span><span class="font-semibold text-gold-600" id="cart-points">+750 Points</span></div>
        </div>
        <div class="flex justify-between items-end pt-4 border-t border-line mb-6">
          <span class="font-bold" data-i18n="cart.summary.total"></span>
          <span class="font-display font-extrabold text-2xl" id="cart-total">15 000 ₸</span>
        </div>
        <a href="checkout.html" class="btn btn-primary w-full mb-3" data-i18n="cart.checkout"></a>
        <a href="catalog.html" class="btn btn-ghost-light w-full" data-i18n="cart.continueShopping"></a>
      </div>
    </div>

    <div id="cart-empty" class="hidden text-center py-24">
      <div class="w-20 h-20 rounded-full bg-paper-100 flex items-center justify-center mx-auto mb-6 text-ink-400"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.4"/><circle cx="18" cy="21" r="1.4"/><path d="M1 1h3l2.7 13.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L21 6H5.2"/></svg></div>
      <h2 class="font-display font-bold text-2xl mb-2" data-i18n="cart.empty.title"></h2>
      <p class="text-ink-500 mb-8" data-i18n="cart.empty.desc"></p>
      <a href="catalog.html" class="btn btn-primary" data-i18n="common.goToCatalog"></a>
    </div>
  </div>
</main>

<div id="app-footer"></div>
<div id="app-whatsapp"></div>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/products.js"></script>
<script>
  FIVEK.mountLayout("cart");

  var cartLines = [
    { slug: "tws-pro-5", qty: 1 },
    { slug: "backpack-urban", qty: 1 },
    { slug: "smart-watch-x1", qty: 1 }
  ];

  function cartLineHTML(line, lang) {
    var p = FIVEK_PRODUCTS.find(function (x) { return x.slug === line.slug; });
    var name = p.name[lang] || p.name.ru;
    return (
      '<div class="surface-card p-4 flex items-center gap-4" data-cart-line="' + p.slug + '">' +
        '<img src="https://placehold.co/140x140/' + p.color + '?text=' + encodeURIComponent(name.split(" ")[0]) + '" class="w-20 h-20 rounded-xl object-cover shrink-0" alt="' + name + '" />' +
        '<div class="flex-1 min-w-0">' +
          '<a href="product.html?slug=' + p.slug + '" class="font-semibold text-sm hover:text-gold-600 block mb-1 clamp-2">' + name + '</a>' +
          '<div class="flex items-center border border-line rounded-full overflow-hidden w-fit">' +
            '<button type="button" class="w-8 h-8 flex items-center justify-center hover:bg-paper-100" data-line-minus>−</button>' +
            '<span class="w-8 text-center text-sm font-bold" data-line-qty>' + line.qty + '</span>' +
            '<button type="button" class="w-8 h-8 flex items-center justify-center hover:bg-paper-100" data-line-plus>+</button>' +
          '</div>' +
        '</div>' +
        '<div class="text-right shrink-0">' +
          '<div class="font-display font-bold" data-line-total>' + (p.price * line.qty).toLocaleString("ru-RU") + ' ₸</div>' +
          '<button type="button" class="text-ink-400 hover:text-red-500 text-xs mt-2" data-line-remove data-i18n="cart.remove"></button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderCart(lang) {
    var host = document.getElementById("cart-items");
    var content = document.getElementById("cart-content");
    var empty = document.getElementById("cart-empty");
    if (!cartLines.length) { content.classList.add("hidden"); empty.classList.remove("hidden"); FIVEK.applyI18n(lang); return; }
    content.classList.remove("hidden"); empty.classList.add("hidden");
    host.innerHTML = cartLines.map(function (l) { return cartLineHTML(l, lang); }).join("");

    var subtotal = cartLines.reduce(function (sum, l) {
      var p = FIVEK_PRODUCTS.find(function (x) { return x.slug === l.slug; });
      return sum + p.price * l.qty;
    }, 0);
    document.getElementById("cart-subtotal").textContent = subtotal.toLocaleString("ru-RU") + " ₸";
    document.getElementById("cart-total").textContent = subtotal.toLocaleString("ru-RU") + " ₸";
    document.getElementById("cart-points").textContent = "+" + Math.round(subtotal * 0.05) + " Points";

    try { localStorage.setItem("5k-cart-count", String(cartLines.reduce(function (s, l) { return s + l.qty; }, 0))); } catch (e) {}
    document.querySelectorAll("[data-cart-badge]").forEach(function (el) { el.textContent = cartLines.reduce(function (s, l) { return s + l.qty; }, 0); });

    FIVEK.applyI18n(lang);
    FIVEK.refreshReveal();
  }

  document.addEventListener("click", function (e) {
    var line = e.target.closest("[data-cart-line]");
    if (!line) return;
    var slug = line.getAttribute("data-cart-line");
    var entry = cartLines.find(function (l) { return l.slug === slug; });
    if (e.target.closest("[data-line-plus]")) entry.qty++;
    if (e.target.closest("[data-line-minus]") && entry.qty > 1) entry.qty--;
    if (e.target.closest("[data-line-remove]")) cartLines = cartLines.filter(function (l) { return l.slug !== slug; });
    renderCart(FIVEK.getLang());
  });

  document.addEventListener("5k:lang-changed", function (e) { renderCart(e.detail.lang); });
  renderCart(FIVEK.getLang());
</script>
</body>
</html>
