<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title data-i18n="nav.earn">5K Earn</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;700;800;900&family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="section-paper font-body text-ink-900">
<a href="#main" class="skip-link">Skip to content</a>
<div id="app-header"></div>

<main id="main">
  <section class="hero-navy grain-surface overflow-hidden">
    <div class="container-5k py-16 md:py-20 text-center reveal">
      <span class="badge badge-yellow mb-4">5K Earn</span>
      <h1 class="font-display font-bold text-white text-3xl md:text-5xl mb-5 max-w-2xl mx-auto" data-i18n="earn.heroTitle"></h1>
      <p class="text-white/60 max-w-lg mx-auto mb-10" data-i18n="earn.heroDesc"></p>

      <div class="surface-card p-5 max-w-md mx-auto flex items-center gap-3">
        <span class="flex-1 font-mono font-bold text-sm text-left truncate">5k.kz/r/AZAMAT21</span>
        <button type="button" class="btn btn-primary !py-2.5 text-sm shrink-0" data-copy-link data-i18n="earn.copyBtn"></button>
      </div>
    </div>
  </section>

  <section class="section-elevated">
    <div class="container-5k py-16 md:py-20">
      <h2 class="font-display font-bold text-3xl text-center mb-12 reveal" data-i18n="earn.stepsTitle"></h2>
      <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
        <div class="surface-card p-6 reveal"><div class="font-display font-extrabold text-gold-500 text-3xl mb-3">01</div><div class="font-bold mb-1" data-i18n="earn.step1.title"></div><div class="text-ink-600 text-sm" data-i18n="earn.step1.desc"></div></div>
        <div class="surface-card p-6 reveal" style="transition-delay:.05s"><div class="font-display font-extrabold text-gold-500 text-3xl mb-3">02</div><div class="font-bold mb-1" data-i18n="earn.step2.title"></div><div class="text-ink-600 text-sm" data-i18n="earn.step2.desc"></div></div>
        <div class="surface-card p-6 reveal" style="transition-delay:.1s"><div class="font-display font-extrabold text-gold-500 text-3xl mb-3">03</div><div class="font-bold mb-1" data-i18n="earn.step3.title"></div><div class="text-ink-600 text-sm" data-i18n="earn.step3.desc"></div></div>
        <div class="surface-card p-6 reveal" style="transition-delay:.15s"><div class="font-display font-extrabold text-gold-500 text-3xl mb-3">04</div><div class="font-bold mb-1" data-i18n="earn.step4.title"></div><div class="text-ink-600 text-sm" data-i18n="earn.step4.desc"></div></div>
      </div>
    </div>
  </section>

  <section class="section-paper border-y border-line">
    <div class="container-5k py-16 md:py-20">
      <h2 class="font-display font-bold text-3xl text-center mb-10 reveal" data-i18n="earn.statsTitle"></h2>
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-5 max-w-3xl mx-auto">
        <div class="surface-card p-6 text-center reveal"><div class="font-display font-extrabold text-3xl text-navy-900 mb-1">340</div><div class="text-ink-500 text-xs" data-i18n="home.earn.stat1"></div></div>
        <div class="surface-card p-6 text-center reveal" style="transition-delay:.05s"><div class="font-display font-extrabold text-3xl text-navy-900 mb-1">58</div><div class="text-ink-500 text-xs" data-i18n="home.earn.stat2"></div></div>
        <div class="surface-card p-6 text-center reveal" style="transition-delay:.1s"><div class="font-display font-extrabold text-3xl text-navy-900 mb-1">21</div><div class="text-ink-500 text-xs" data-i18n="home.earn.stat3"></div></div>
        <div class="surface-card p-6 text-center reveal" style="transition-delay:.15s"><div class="font-display font-extrabold text-3xl text-leaf-600 mb-1">42 000 ₸</div><div class="text-ink-500 text-xs" data-i18n="home.earn.stat4"></div></div>
      </div>
    </div>
  </section>

  <section class="section-elevated">
    <div class="container-5k py-16 md:py-20 grid lg:grid-cols-2 gap-10 items-center">
      <div class="relative rounded-xl overflow-hidden reveal">
        <img src="assets/img/photo/db44d8eb9ab532a5028db13deaeb48d6.jpg" alt="5K Earn" class="w-full h-[280px] object-cover" loading="lazy" />
        <div class="absolute inset-0 bg-gradient-to-t from-navy-900/80 to-transparent"></div>
        <div class="absolute inset-0 bg-gold-400/10 mix-blend-multiply"></div>
      </div>
      <div class="reveal" style="transition-delay:.1s">
        <h2 class="font-display font-bold text-2xl md:text-3xl mb-4" data-i18n="earn.antifraudTitle"></h2>
        <p class="text-ink-600 leading-relaxed" data-i18n="earn.antifraudDesc"></p>
      </div>
    </div>
  </section>
</main>

<div id="app-footer"></div>
<div id="app-whatsapp"></div>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>
  FIVEK.mountLayout("earn");
  document.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-copy-link]");
    if (!btn) return;
    var original = FIVEK.t("earn.copyBtn", FIVEK.getLang());
    btn.textContent = FIVEK.t("earn.copiedBtn", FIVEK.getLang());
    btn.removeAttribute("data-i18n");
    setTimeout(function () { btn.setAttribute("data-i18n", "earn.copyBtn"); btn.textContent = FIVEK.t("earn.copyBtn", FIVEK.getLang()); }, 1800);
  });
</script>
</body>
</html>
